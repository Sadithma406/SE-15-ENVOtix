name: ML and Hardware CI

on:
  push:
    branches: [ main, master ]
    paths:
      - 'ML_Hardware/**'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'ML_Hardware/**'

jobs:
  ml-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./ML_Hardware
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
      - name: Install requirements
        run: pip install -r requirements.txt
      - name: Run Model Test Script
        run: python src/test_model.py