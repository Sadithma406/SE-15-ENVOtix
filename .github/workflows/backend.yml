name: Backend CI

on:
  push:
    branches: [ main, master ]
    paths:
      - 'Backend/**'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'Backend/**'

jobs:
  backend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./Backend
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: './Backend/package-lock.json'
      - name: Install Dependencies
        run: npm install
      - name: Run Tests
        run: npm test